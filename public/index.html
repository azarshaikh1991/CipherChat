<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherChat</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Login / Signup Screen -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2>CipherChat</h2>
            <input type="text" id="username-input" placeholder="Username" autocomplete="off">
            <input type="password" id="password-input" placeholder="Password">
            <div class="login-actions">
                <button id="login-btn" class="login-btn">Login</button>
                <button id="register-btn" class="register-btn">Sign Up</button>
            </div>
        </div>
        <!-- Developer Credit Tag -->
        <div class="creator-credit">Created by Azar</div>
    </div>

    <!-- Messenger Main Container (Initially Hidden) -->
    <div class="app-wrapper" id="messenger-container" style="display: none;">
        <div class="messenger-card">
            <!-- Header -->
            <div class="app-header">
                <div class="brand-title">CipherChat</div>
                <div class="user-controls">
                    <span id="current-username-display">Hello, user!</span>
                    <button id="logout-btn" class="logout-btn">Logout</button>
                </div>
            </div>

            <!-- Body Layout: Sidebar + Chat Section -->
            <div class="app-body">
                <!-- Active/Inactive Users Sidebar -->
                <div class="users-sidebar">
                    <h4>Chats</h4>
                    <div class="user-list" id="user-list">
                        <!-- Dynamic users -->
                    </div>
                </div>

                <!-- Chat Section -->
                <div class="chat-section">
                    <div class="chat-header-bar" style="display: flex; justify-content: space-between; align-items: center;">
                        <h3 id="current-chat-title">Select a user to start chat</h3>
                        <div id="chat-header-actions" style="display: none; gap: 8px;">
                            <button onclick="downloadCurrentChatImage()" style="background: #00695c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Download</button>
                            <button onclick="downloadAllChatImages()" style="background: #004d40; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Download All</button>
                        </div>
                    </div>
                    
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages -->
                    </div>

                    <div class="chat-input-area" id="chat-input-area" style="display: none;">
                        <label for="image-input" class="upload-btn-label" title="Send Image">📎</label>
                        <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="sendImage(event)">
                        
                        <input type="text" id="message-input" placeholder="Type a message...">
                        <button id="send-msg-btn" class="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
