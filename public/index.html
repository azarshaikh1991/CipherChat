<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arzo - Private Messenger</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; margin: 0; padding: 0; display: flex; height: 100vh; justify-content: center; align-items: center; }
        #auth-container, #chat-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        #chat-container { display: none; width: 750px; height: 550px; display: flex; flex-direction: row; }
        .sidebar { width: 30%; border-right: 1px solid #ddd; padding-right: 10px; overflow-y: auto; }
        .chat-area { width: 70%; display: flex; flex-direction: column; padding-left: 15px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .user-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; border-radius: 4px; }
        .user-item:hover, .user-item.active { background: #f0f8ff; font-weight: bold; }
        #messages { flex-grow: 1; border: 1px solid #ddd; border-radius: 4px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .message { margin-bottom: 8px; padding: 6px 10px; border-radius: 6px; max-width: 80%; }
        .message.sent { background: #dcf8c6; margin-left: auto; text-align: right; }
        .message.received { background: #fff; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <!-- Auth Container (Login / Signup) -->
    <div id="auth-container">
        <h2 id="form-title">Arzo Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleAuth()">Login</button>
        <p style="text-align:center; cursor:pointer; color:#007bff;" onclick="toggleAuthMode()" id="toggle-text">New to Arzo? Create an account</p>
        <p id="auth-error" style="color:red; font-size:14px;"></p>
    </div>

    <!-- Chat Container -->
    <div id="chat-container" style="display:none;">
        <div class="sidebar">
            <h3>Chats</h3>
            <div id="user-list"></div>
        </div>
        <div class="chat-area">
            <h3 id="current-chat-title">Select a user to chat</h3>
            <div id="messages"></div>
            <div style="display: flex;">
                <input type="text" id="message-input" placeholder="Type a message..." disabled style="margin: 0; flex-grow: 1;">
                <button onclick="sendMessage()" id="send-btn" disabled style="width: 80px; margin: 0 0 0 5px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket;
        let currentUser = '';
        let activeRecipient = null;
        let isSignupMode = false;
        const messagesStore = {}; // { username: [ {sender, message, timestamp} ] }

        function toggleAuthMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('form-title').innerText = isSignupMode ? 'Create Arzo Account' : 'Arzo Login';
            document.getElementById('toggle-text').innerText = isSignupMode ? 'Already have an account? Login' : 'New to Arzo? Create an account';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('auth-error');

            if (!username || !password) {
                errorEl.innerText = 'Please fill in all fields';
                return;
            }

            const endpoint = isSignupMode ? '/api/signup' : '/api/login';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    errorEl.innerText = data.error || 'Authentication failed';
                    return;
                }

                if (isSignupMode) {
                    alert(data.message);
                    toggleAuthMode();
                } else {
                    currentUser = data.username;
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('chat-container').style.display = 'flex';
                    initSocket();
                }
            } catch (err) {
                errorEl.innerText = 'Server error occurred';
            }
        }

        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                socket.emit('join', currentUser);
            });

            socket.on('online-users', (users) => {
                const userListEl = document.getElementById('user-list');
                userListEl.innerHTML = '';
                users.forEach(user => {
                    if (user !== currentUser) {
                        if (!messagesStore[user]) messagesStore[user] = [];
                        const div = document.createElement('div');
                        div.className = `user-item ${activeRecipient === user ? 'active' : ''}`;
                        div.innerText = user;
                        div.onclick = () => selectRecipient(user);
                        userListEl.appendChild(div);
                    }
                });
            });

            socket.on('privateMessage', (data) => {
                const chatPartner = data.sender === currentUser ? activeRecipient : data.sender;
                if (!chatPartner) return;
                
                if (!messagesStore[chatPartner]) messagesStore[chatPartner] = [];
                messagesStore[chatPartner].push(data);

                if (activeRecipient === chatPartner) {
                    renderMessages();
                }
            });
        }

        function selectRecipient(user) {
            activeRecipient = user;
            document.getElementById('current-chat-title.innerText = `Chat with ${user}`;
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            
            // Highlight active user
            document.querySelectorAll('.user-item').forEach(el => {
                el.classList.toggle('active', el.innerText === user);
            });

            renderMessages();
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message || !activeRecipient) return;

            socket.emit('privateMessage', {
                recipient: activeRecipient,
                message: message,
                sender: currentUser
            });

            input.value = '';
        }

        function renderMessages() {
            const messagesEl = document.getElementById('messages');
            messagesEl.innerHTML = '';
            if (!activeRecipient || !messagesStore[activeRecipient]) return;

            messagesStore[activeRecipient].forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender === currentUser ? 'sent' : 'received'}`;
                div.innerHTML = `<strong>${msg.sender === currentUser ? 'You' : msg.sender}:</strong> ${msg.message} <br><small style="font-size:10px; color:#666;">${msg.timestamp}</small>`;
                messagesEl.appendChild(div);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
