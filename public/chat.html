<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arzo - Chat Room</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e0f7fa; margin: 0; padding: 20px; display: flex; justify-content: center; height: 90vh; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #00796b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-header .brand { font-size: 20px; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f9f9f9; }
        .message { background: #e0f2f1; padding: 12px; border-radius: 8px; max-width: 75%; align-self: flex-start; }
        .message.my-message { background: #b2dfdb; align-self: flex-end; }
        .message .user { font-weight: bold; font-size: 12px; color: #004d40; margin-bottom: 5px; }
        .chat-input { display: flex; padding: 15px; border-top: 1px solid #ddd; background: white; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .chat-input button { background: #00796b; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .chat-input button:hover { background: #004d40; }
        .logout-btn { background: #d32f2f; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span class="brand">ARZO</span>
        <span>Hello, <b id="displayUsername"></b>! <button class="logout-btn" onclick="logout()">Logout</button></span>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Type a message to Arzo room...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const username = localStorage.getItem('username');
    const token = localStorage.getItem('token');

    if (!token || !username) {
        window.location.href = '/index.html';
    }

    document.getElementById('displayUsername').innerText = username;

    const socket = io();
    const chatBox = document.getElementById('chatBox');

    socket.on('message', (data) => {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        if(data.user === username) msgDiv.classList.add('my-message'); // Aapka message right side me
        
        msgDiv.innerHTML = `<div class="user">${data.user}</div><div>${data.text}</div>`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (input.value.trim() !== '') {
            socket.emit('chatMessage', { user: username, text: input.value });
            input.value = '';
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/index.html';
    }

    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
